<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>이음 — 우리 동네 특수체육</title>
  <meta name="description" content="등록 장애인 263만 명을 위한 통합 특수체육 검색 플랫폼. 시·군·구 단위로 가까운 시설과 인증된 지도자를 연결합니다."/>
  <link rel="stylesheet" href="colors_and_type.css"/>
  <link rel="stylesheet" href="styles.css"/>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- 로컬 개발 전용 네이버 Client ID (Git 제외됨) -->
  <script src="naver-config.local.js" onerror="void 0"></script>
  <!-- 네이버 지도 SDK: React보다 먼저 로드해 타이밍 문제 방지
       로컬: naver-config.local.js의 __NAVER_CLIENT_ID 사용
       Vercel: 런타임에 /api/config → initNaverMaps 에서 처리 -->
  <script>
    (function () {
      var id = window.__NAVER_CLIENT_ID;
      if (!id) return;
      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=' + id;
      s.onload = function () {
        window.__naverMapsLoaded = true;
        window.dispatchEvent(new CustomEvent('naverMapsReady'));
      };
      s.onerror = function () {
        console.warn('[이음] 네이버 지도 스크립트 로드 실패. API 키 또는 허용 도메인을 확인하세요.');
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Modal roots -->
  <div id="modal-root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- App modules (Babel JSX) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="supabase-client.js" data-type="module"></script>
  <script src="supabase-client.js"></script>
  <script src="geo.js"></script>

  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="components/nav.jsx"></script>
  <script type="text/babel" src="components/hero.jsx"></script>
  <script type="text/babel" src="components/sections-a.jsx"></script>
  <script type="text/babel" src="components/sections-b.jsx"></script>
  <script type="text/babel" src="components/sections-c.jsx"></script>
  <script type="text/babel" src="components/modals.jsx"></script>
  <script type="text/babel" src="components/naver-setup-modal.jsx"></script>
  <script type="text/babel" src="components/search-results.jsx"></script>

  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
